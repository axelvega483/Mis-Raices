# ===== LOGGING CONFIGURATION =====
logging.level.com.MisRaices=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.file.name=logs/mis-raices-app.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %highlight(%-5level) - %cyan(%logger{36}) - %msg%n

# ===== SWAGGER/OPENAPI CONFIGURATION =====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ===== SECURITY (Basic for development) =====
# En producción considera usar Spring Security
spring.web.resources.add-mappings=false

# ===== ASYNC CONFIGURATION =====
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-

# ===== FILE UPLOAD CONFIGURATION =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB